  <text x="260" y="32" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Risk/reward · exempel 1 : 3</text>
  <rect x="80" y="70" width="70" height="120" rx="8" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
  <text x="115" y="140" text-anchor="middle" fill="#fecaca" font-family="system-ui,sans-serif" font-size="14" font-weight="700">−1R</text>
