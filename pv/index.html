<script>
(function(){
  const blob = JSON.parse(document.getElementById('blob').textContent);
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  function b64(s){ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  async function deriveKey(code, salt, iter){
    const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations: iter, hash:'SHA-256'},
      base,
      {name:'AES-GCM', length:256},
      false,
      ['decrypt']
    );
  }
  async function unlock(code){
    const salt = b64(blob.salt);
    const iv = b64(blob.iv);
    const data = b64(blob.ct);
    const key = await deriveKey(code, salt, blob.iter|0);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
    return dec.decode(pt);
  }
  const f=document.getElementById('f');
  const e=document.getElementById('e');
  const b=document.getElementById('b');
  f.addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    e.textContent='';
    b.disabled=true;
    try{
      const html = await unlock(document.getElementById('c').value.trim());
      document.getElementById('gate').classList.add('hide');
      document.getElementById('view').classList.add('open');
      const frame=document.getElementById('frame');
      frame.srcdoc = html;
      try{ sessionStorage.setItem('pv.ok','1'); }catch(_){}
    }catch(err){
      e.textContent='Wrong code, or this browser cannot decrypt.';
      b.disabled=false;
    }
  });
})();
</script>
