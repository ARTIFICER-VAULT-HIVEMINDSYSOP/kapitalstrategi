<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traderider</title>
    <script>
      /* Yahoo chart requests fail CORS in the browser and log a console error. The desk already falls back to bundled candles. */
      (function () {
        var nativeFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : input && input.url ? input.url : "";
          if (url.indexOf("query1.finance.yahoo.com") !== -1) {
            return Promise.reject(new TypeError("Yahoo is not called from this static page"));
          }
          return nativeFetch(input, init);
        };
      })();
    </script>
    <script type="module" crossorigin src="/traderider/v2/assets/static-OY3HSHMS.js"></script>
