<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="Teknisk vs fundamental">
  <rect width="520" height="240" rx="16" fill="#0f172a"/>
  <rect x="24" y="40" width="220" height="170" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="134" y="72" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="14" font-weight="700">TEKNISK</text>
  <polyline fill="none" stroke="#7dd3fc" stroke-width="2.5" points="50,160 90,140 120,150 160,110 200,120 220,90"/>
  <text x="134" y="190" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">“När / var i grafen?”</text>
  <rect x="276" y="40" width="220" height="170" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="386" y="72" text-anchor="middle" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="14" font-weight="700">FUNDAMENTAL</text>
  <text x="386" y="120" text-anchor="middle" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="12">Rapporter · makro</text>
  <text x="386" y="145" text-anchor="middle" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="12">Bolag · nyheter</text>
  <text x="386" y="190" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">“Varför / är det billigt?”</text>
</svg>
