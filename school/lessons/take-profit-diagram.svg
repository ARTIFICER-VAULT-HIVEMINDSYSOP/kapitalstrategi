<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-label="Take-profit T/P">
  <rect width="560" height="280" rx="16" fill="#0a1628"/>
  <text x="280" y="32" text-anchor="middle" fill="#c4a35a" font-family="system-ui,sans-serif" font-size="12" font-weight="700" letter-spacing="0.1em">TAKE-PROFIT · T/P</text>
  <text x="280" y="56" text-anchor="middle" fill="#f3ead2" font-family="Georgia,serif" font-size="18" font-weight="700">Planerad vinstnivå</text>

  <!-- chart baseline -->
  <line x1="70" y1="220" x2="500" y2="220" stroke="#334155" stroke-width="2"/>

  <!-- price path up to TP -->
  <polyline fill="none" stroke="#38bdf8" stroke-width="3"
    points="90,190 160,175 220,160 280,130 340,100 400,85 460,78"/>

  <!-- Entry -->
  <line x1="90" y1="175" x2="480" y2="175" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="160" cy="175" r="7" fill="#94a3b8"/>
  <text x="160" y="160" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Entry 100</text>

  <!-- TP line -->
  <line x1="90" y1="85" x2="480" y2="85" stroke="#34d399" stroke-width="2.5" stroke-dasharray="7 4"/>
  <circle cx="400" cy="85" r="8" fill="#34d399"/>
  <text x="400" y="70" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="13" font-weight="700">T/P 109</text>
  <text x="490" y="90" fill="#34d399" font-family="system-ui,sans-serif" font-size="12" font-weight="700">ta hem</text>

  <!-- arrow gain -->
  <line x1="230" y1="170" x2="230" y2="95" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#34d399"/>
    </marker>
  </defs>
  <text x="248" y="135" fill="#a7f3d0" font-family="system-ui,sans-serif" font-size="12" font-weight="700">+9 · vinstmål</text>

  <text x="280" y="255" text-anchor="middle" fill="#9aabc0" font-family="system-ui,sans-serif" font-size="12">T/P = exit med vinst enligt plan — inte en garanti att priset når dit</text>
</svg>
