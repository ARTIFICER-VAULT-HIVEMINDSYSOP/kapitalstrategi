<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Ränta på ränta växer snabbare">
  <rect width="520" height="260" rx="16" fill="#0f172a"/>
  <text x="260" y="30" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Enkel ränta vs ränta på ränta</text>
  <!-- axes -->
  <line x1="48" y1="210" x2="480" y2="210" stroke="#475569" stroke-width="2"/>
  <line x1="48" y1="50" x2="48" y2="210" stroke="#475569" stroke-width="2"/>
  <!-- simple interest line -->
  <polyline fill="none" stroke="#94a3b8" stroke-width="3" points="48,190 140,170 230,150 320,130 410,110 480,95"/>
  <text x="400" y="88" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Enkel</text>
  <!-- compound curve -->
  <path d="M48 190 C 120 185, 180 160, 240 130 S 360 70, 480 40" fill="none" stroke="#34d399" stroke-width="3.5"/>
  <text x="400" y="48" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="11" font-weight="700">Compound</text>
  <text x="260" y="240" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">Tid →   ·   mer tid = mer skillnad</text>
  <text x="20" y="130" fill="#64748b" font-family="system-ui,sans-serif" font-size="10" transform="rotate(-90 20 130)">Värde</text>
</svg>
