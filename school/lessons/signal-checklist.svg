<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="Granska signaler">
  <rect width="520" height="240" rx="16" fill="#0f172a"/>
  <text x="260" y="32" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Signal-checklista (utbildning)</text>
  <g font-family="system-ui,sans-serif" font-size="13">
    <rect x="48" y="56" width="424" height="36" rx="8" fill="#1e293b"/>
    <text x="68" y="79" fill="#34d399">✓</text>
