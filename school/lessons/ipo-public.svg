<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="IPO privat till börs">
  <rect width="520" height="240" rx="16" fill="#0f172a"/>
  <rect x="36" y="60" width="160" height="120" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="116" y="110" text-anchor="middle" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="14" font-weight="700">PRIVAT</text>
  <text x="116" y="138" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Få ägare</text>
  <text x="230" y="125" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="18" font-weight="700">IPO →</text>
  <rect x="320" y="60" width="160" height="120" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="14" font-weight="700">BÖRS</text>
