<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-label="Hävstång förstärker vinst och förlust">
  <rect width="520" height="240" rx="16" fill="#0f172a"/>
  <text x="260" y="32" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Hävstång = förstoringsglas på risk</text>
  <rect x="40" y="70" width="100" height="100" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="90" y="115" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">10 000</text>
  <text x="90" y="138" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">eget kapital</text>
  <text x="175" y="125" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="22" font-weight="700">×10</text>
  <rect x="220" y="55" width="140" height="130" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="290" y="105" text-anchor="middle" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="13" font-weight="700">100 000</text>
  <text x="290" y="130" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">position</text>
  <text x="290" y="155" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="11">−2 % pris</text>
  <text x="290" y="175" text-anchor="middle" fill="#f87171" font-family="system-ui,sans-serif" font-size="12" font-weight="700">≈ −20 % kapital</text>
  <rect x="390" y="80" width="100" height="90" rx="10" fill="#14532d" stroke="#34d399" stroke-width="2"/>
  <text x="440" y="120" text-anchor="middle" fill="#bbf7d0" font-family="system-ui,sans-serif" font-size="11">Samma</text>
  <text x="440" y="140" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="12" font-weight="700">+2 % →</text>
  <text x="440" y="160" text-anchor="middle" fill="#34d399" font-family="system-ui,sans-serif" font-size="12" font-weight="700">+20 %</text>
</svg>
